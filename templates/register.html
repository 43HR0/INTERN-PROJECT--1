{% extends "base.html" %}
{% block title %}Create account · StreamBox{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">START YOUR LIBRARY</div><h1>Create account</h1>
  <form method="post" class="stack">
    <label>Username<input name="username" required minlength="3" autocomplete="username"></label>
    <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="button primary full">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
